<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>YASLAM LINK BYPASS</title>
  <style>
    :root { color-scheme: dark; --bg:#050505; --panel:#0c0c0c; --line:#242424; --muted:#9b9b9b; --white:#f5f5f5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#171717 0%,#050505 55%); color:var(--white); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
    .wrap { width:min(100%,620px); }
    .brand { display:flex; align-items:center; gap:11px; justify-content:center; margin-bottom:30px; letter-spacing:3px; font-size:12px; color:#cfcfcf; font-weight:800; }
    .mark { width:32px;height:32px;border:1px solid #555;border-radius:10px;display:grid;place-items:center;font-size:17px;color:#fff;background:#111; }
    h1 { text-align:center; font-size:clamp(30px,7vw,48px); line-height:1.05; letter-spacing:-1.8px; margin:0 0 13px; font-weight:900; }
    h1 span { color:#777; }
    .sub { text-align:center; color:var(--muted); font-size:14px; line-height:1.6; margin:0 auto 28px; max-width:430px; }
    .card { border:1px solid var(--line); border-radius:20px; background:linear-gradient(145deg,#101010,#080808); padding:clamp(18px,5vw,28px); box-shadow:0 24px 80px #0008; }
    label { display:block; color:#ddd; font-size:12px; font-weight:750; margin:0 0 10px; letter-spacing:.7px; }
    .inputrow { display:flex; gap:9px; }
    input { min-width:0; flex:1; background:#050505; border:1px solid #303030; color:#fff; border-radius:12px; padding:15px 14px; font-size:14px; outline:none; }
    input:focus { border-color:#777; box-shadow:0 0 0 3px #ffffff0a; }
    button { border:0; border-radius:12px; background:#f4f4f4; color:#080808; padding:0 19px; font-weight:900; font-size:12px; letter-spacing:.6px; cursor:pointer; transition:transform .15s,opacity .15s; white-space:nowrap; }
    button:hover { transform:translateY(-1px); } button:disabled { opacity:.55; cursor:wait; transform:none; }
    .hint { color:#777; font-size:11px; margin:10px 2px 0; }
    .status { display:none; margin-top:17px; padding:13px 14px; border-radius:12px; background:#111; border:1px solid #262626; color:#cfcfcf; font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
    .status.show { display:block; }
    .status.error { border-color:#5b2929; color:#ffb8b8; }
    .result { display:none; margin-top:17px; }
    .result.show { display:block; }
    .resulttop { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:9px; font-size:11px; letter-spacing:1px; color:#aaa; font-weight:800; }
    .url { overflow-wrap:anywhere; background:#050505; border:1px solid #292929; border-radius:12px; padding:14px; color:#e9e9e9; font-size:13px; line-height:1.6; }
    .actions { display:flex; gap:9px; margin-top:10px; }
    .actions button { min-height:42px; flex:1; border:1px solid #333; background:#141414; color:#fff; }
    .actions .primary { background:#f4f4f4; color:#080808; border-color:#f4f4f4; }
    footer { text-align:center; color:#555; font-size:11px; margin-top:22px; letter-spacing:.6px; }
    .dot { display:inline-block;width:6px;height:6px;background:#aaa;border-radius:50%;margin-right:7px; }
    @media(max-width:480px) { .inputrow { flex-direction:column; } button#submit { min-height:48px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><div class="mark">Y</div><span>YASLAM TOOLS</span></div>
    <h1>LINK <span>BYPASS</span></h1>
    <p class="sub">Masukkan link SFL untuk mendapatkan URL tujuan akhirnya. Simpel, cepat, tanpa ribet.</p>
    <section class="card">
      <form id="form">
        <label for="link">LINK SFL</label>
        <div class="inputrow">
          <input id="link" name="url" type="url" placeholder="https://sfl.gl/..." autocomplete="url" required>
          <button id="submit" type="submit">BYPASS LINK ↗</button>
        </div>
        <p class="hint">Mendukung link sfl.gl dan domain Safelinku yang didukung API.</p>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="result" class="result">
        <div class="resulttop"><span>✓ HASIL BYPASS</span><span>YASLAM</span></div>
        <div id="finalUrl" class="url"></div>
        <div class="actions">
          <button id="copy" class="primary" type="button">SALIN URL</button>
          <button id="open" type="button">BUKA LINK ↗</button>
        </div>
      </section>
    </section>
    <footer>YASLAM LINK BYPASS · DARK EDITION</footer>
  </main>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('link');
    const submit = document.getElementById('submit');
    const statusBox = document.getElementById('status');
    const resultBox = document.getElementById('result');
    const finalUrlBox = document.getElementById('finalUrl');
    const copyBtn = document.getElementById('copy');
    const openBtn = document.getElementById('open');
    let currentResult = '';

    function status(message, isError=false) {
      statusBox.textContent = message;
      statusBox.className = 'status show' + (isError ? ' error' : '');
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      resultBox.className = 'result';
      statusBox.className = 'status';
      let url;
      try { url = new URL(input.value.trim()); }
      catch { status('Masukkan URL yang valid.', true); return; }
      const allowed = ['sfl.gl','www.sfl.gl','safelinku.com','www.safelinku.com','linku.to','www.linku.to','lokerwfh.net','www.lokerwfh.net'];
      if (url.protocol !== 'https:' && url.protocol !== 'http:') { status('URL harus menggunakan HTTP atau HTTPS.', true); return; }
      if (!allowed.includes(url.hostname.toLowerCase())) { status('Domain belum didukung. Masukkan link SFL/Safelinku yang valid.', true); return; }

      submit.disabled = true;
      submit.textContent = 'MEMPROSES…';
      status('<span class="dot"></span> Sedang memproses link…');
      // Use textContent, not HTML, for all API-provided values.
      try {
        const response = await fetch('/api/bypass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url.href })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Permintaan gagal. Coba lagi nanti.');
        currentResult = data.url;
        if (!currentResult) throw new Error('API tidak mengembalikan URL hasil.');
        finalUrlBox.textContent = currentResult;
        resultBox.className = 'result show';
        status('Berhasil mendapatkan URL tujuan.');
      } catch (err) {
        status(err.message || 'Terjadi kesalahan. Coba lagi.', true);
      } finally {
        submit.disabled = false;
        submit.textContent = 'BYPASS LINK ↗';
      }
    });
    copyBtn.addEventListener('click', async () => {
      if (!currentResult) return;
      try {
        await navigator.clipboard.writeText(currentResult);
        copyBtn.textContent = 'TERSALIN ✓';
        setTimeout(() => copyBtn.textContent = 'SALIN URL', 1600);
      } catch {
        const range = document.createRange();
        range.selectNodeContents(finalUrlBox);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        status('Salin URL yang sudah dipilih.', true);
      }
    });
    openBtn.addEventListener('click', () => {
      if (!currentResult) return;
      const safe = new URL(currentResult);
      if (safe.protocol === 'http:' || safe.protocol === 'https:') window.open(safe.href, '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
